<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PointTrack — Classroom Points Tracker</title>
<meta name="description" content="PointTrack is a simple classroom points tracker for teachers.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f5f7fb;
  --surface:#fff;
  --surface-2:#f0f3f8;
  --text:#172033;
  --muted:#6b7280;
  --border:#dfe4ec;
  --primary:#2563eb;
  --primary-hover:#1d4ed8;
  --danger:#dc2626;
  --success:#16a34a;
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --shadow-hover:0 14px 35px rgba(15,23,42,.12);
}

body.dark{
  --bg:#101318;
  --surface:#181c23;
  --surface-2:#222731;
  --text:#f1f5f9;
  --muted:#9ca3af;
  --border:#303744;
  --primary:#3b82f6;
  --primary-hover:#60a5fa;
  --danger:#ef4444;
  --success:#22c55e;
  --shadow:0 10px 30px rgba(0,0,0,.25);
  --shadow-hover:0 14px 35px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

html,body{
  max-width:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .2s,color .2s;
}

button,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.65}
.hidden{display:none!important}

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:42px 36px;
  box-shadow:var(--shadow);
  text-align:center;
}

.logo{
  width:58px;
  height:58px;
  margin:0 auto 18px;
  border-radius:15px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:25px;
}

.login-card h1{
  margin:0;
  font-size:30px;
  letter-spacing:-.5px;
}

.login-card p{
  color:var(--muted);
  margin:10px 0 28px;
  line-height:1.5;
}

.google-btn{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  padding:13px 16px;
  border-radius:10px;
  font-weight:600;
  transition:.2s;
}

.google-btn:hover{background:var(--surface-2)}
.google-icon{margin-right:8px;font-weight:bold}

#app{min-height:100vh}

header{
  height:70px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:800;
  font-size:20px;
  min-width:0;
}

.brand-logo{
  width:34px;
  height:34px;
  flex-shrink:0;
  border-radius:9px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn,.logout-btn,.secondary-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:9px;
  padding:9px 12px;
}

.icon-btn:hover,.logout-btn:hover,.secondary-btn:hover{
  background:var(--surface-2);
}

main{
  width:100%;
  max-width:1100px;
  min-width:0;
  margin:0 auto;
  padding:34px 22px 60px;
}

.dashboard-welcome{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:25px;
  margin-bottom:30px;
}

.welcome{min-width:0}

.welcome h2{
  margin:0 0 7px;
  font-size:30px;
  letter-spacing:-.6px;
}

.welcome p{
  margin:0;
  color:var(--muted);
  overflow-wrap:anywhere;
}

.dashboard-create-btn{
  flex-shrink:0;
  border:0;
  background:var(--primary);
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
  box-shadow:0 5px 14px rgba(37,99,235,.2);
  transition:.2s;
}

.dashboard-create-btn:hover{
  background:var(--primary-hover);
  transform:translateY(-1px);
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:34px;
}

.stat-card{
  min-width:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:19px 20px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

.stat-value{
  font-size:26px;
  font-weight:800;
  letter-spacing:-.4px;
  overflow-wrap:anywhere;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:16px;
}

.section-header h3{
  margin:0;
  font-size:20px;
}

.section-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.classes-grid{
  min-width:0;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(285px,1fr));
  gap:16px;
  align-items:start;
}

.class-card{
  min-width:0;
  width:100%;
  position:relative;
  align-self:start;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:15px;
  padding:21px;
  box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s,box-shadow .15s;
  overflow:hidden;
}

.class-card:hover{
  transform:translateY(-2px);
  border-color:var(--primary);
  box-shadow:var(--shadow-hover);
}

.class-card-top{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:start;
  gap:12px;
}

.class-card-top>div:first-child{min-width:0}

.class-card h4{
  margin:0 0 6px;
  font-size:19px;
  line-height:1.25;
  overflow-wrap:anywhere;
  word-break:break-word;
  max-height:3.75em;
  overflow:hidden;
}

.class-info{
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  min-height:19px;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.class-delete{
  flex-shrink:0;
  position:relative;
  z-index:2;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:17px;
  padding:3px 5px;
  border-radius:6px;
}

.class-delete:hover{
  color:var(--danger);
  background:var(--surface-2);
}

.class-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:19px 0;
}

.class-stat{
  min-width:0;
  background:var(--surface-2);
  border-radius:9px;
  padding:11px 12px;
}

.class-stat-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:3px;
}

.class-stat-value{
  font-size:16px;
  font-weight:800;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.open-class{
  width:100%;
  border:0;
  background:var(--primary);
  color:#fff;
  padding:10px;
  border-radius:9px;
  font-weight:700;
  transition:.15s;
}

.open-class:hover{background:var(--primary-hover)}

.empty-state{
  min-width:0;
  background:var(--surface);
  border:1px dashed var(--border);
  border-radius:14px;
  padding:48px 20px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
  overflow-wrap:anywhere;
}

.empty-icon{
  width:48px;
  height:48px;
  margin:0 auto 14px;
  border-radius:13px;
  background:var(--surface-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.empty-title{
  color:var(--text);
  font-weight:700;
  margin-bottom:6px;
}

.empty-description{
  font-size:14px;
  line-height:1.5;
  margin-bottom:18px;
}

.empty-create-btn{
  border:0;
  background:var(--primary);
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-weight:600;
}

.back-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  padding:9px 13px;
  border-radius:8px;
  margin-bottom:22px;
}

.back-btn:hover{background:var(--surface-2)}

.class-title{
  min-width:0;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:25px;
}

.class-title>div:first-child{min-width:0}

.class-title h2{
  margin:0 0 5px;
  font-size:28px;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.class-title p{
  margin:0;
  color:var(--muted);
  overflow-wrap:anywhere;
}

.class-actions{
  display:flex;
  gap:9px;
  align-items:center;
  flex-shrink:0;
}

.primary-btn{
  border:0;
  background:var(--primary);
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-weight:600;
}

.primary-btn:hover{background:var(--primary-hover)}

.student-list{
  display:grid;
  gap:12px;
  min-width:0;
}

.student-card{
  min-width:0;
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  padding:16px 18px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.student-name{
  font-weight:700;
  font-size:17px;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.student-controls{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.point-btn{
  width:38px;
  height:38px;
  flex-shrink:0;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  font-weight:700;
  font-size:18px;
}

.point-btn:hover{border-color:var(--primary)}

.amount-input{
  width:85px;
  height:38px;
  flex-shrink:0;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--surface);
  color:var(--text);
  text-align:center;
  outline:none;
}

.amount-input:focus{border-color:var(--primary)}

.points-display{
  min-width:85px;
  max-width:280px;
  text-align:right;
  font-size:21px;
  font-weight:800;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.remove-student{
  flex-shrink:0;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:16px;
  margin-left:5px;
}

.remove-student:hover{color:var(--danger)}

.point-float{
  position:absolute;
  right:125px;
  top:50%;
  pointer-events:none;
  font-weight:800;
  font-size:17px;
  animation:floatPoint .8s ease-out forwards;
  z-index:20;
}

.point-float.positive{color:var(--success)}
.point-float.negative{color:var(--danger)}

@keyframes floatPoint{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-42px) scale(1.08)}
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  width:100%;
  max-width:430px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:25px;
  box-shadow:var(--shadow);
}

.modal h3{
  margin:0 0 20px;
  font-size:21px;
}

.field{margin-bottom:15px}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:600;
  color:var(--muted);
}

.field input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--surface);
  color:var(--text);
  outline:none;
}

.field input:focus{border-color:var(--primary)}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:20px;
}

.history-modal{
  max-width:650px;
  max-height:80vh;
  overflow-y:auto;
}

.history-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:20px;
}

.history-header h3{margin:0 0 5px}

.history-header p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  overflow-wrap:anywhere;
}

.history-container{
  display:grid;
  gap:8px;
}

.history-entry{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:13px 14px;
  background:var(--surface-2);
  border-radius:9px;
}

.history-student{
  font-weight:600;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.history-time{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.history-amount{
  font-weight:800;
  white-space:nowrap;
}

.history-amount.positive{color:var(--success)}
.history-amount.negative{color:var(--danger)}

.history-empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

@media(max-width:700px){
  header{padding:0 15px}
  main{padding:25px 14px 50px}

  .dashboard-welcome{
    align-items:stretch;
    flex-direction:column;
    gap:17px;
  }

  .dashboard-create-btn{width:100%}

  .stats-grid{
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:28px;
  }

  .stat-card{padding:15px 17px}
  .classes-grid{grid-template-columns:1fr}

  .logout-btn{font-size:13px}

  .student-card{
    grid-template-columns:1fr;
    gap:12px;
  }

  .student-controls{
    width:100%;
    flex-wrap:wrap;
  }

  .points-display{margin-left:auto}

  .point-float{right:100px}

  .class-title{
    align-items:flex-start;
    flex-direction:column;
  }

  .class-actions{
    width:100%;
    flex-direction:column;
    align-items:stretch;
  }

  .class-actions button{width:100%}
  .history-modal{max-height:90vh}
}

@media(max-width:430px){
  .student-controls{
    display:grid;
    grid-template-columns:38px 1fr 38px auto 32px;
    width:100%;
  }

  .amount-input{width:100%}

  .points-display{
    min-width:0;
    max-width:100%;
  }

  .point-float{right:90px}
}
</style>
</head>

<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="logo">PT</div>
    <h1>PointTrack</h1>
    <p>A simple digital classroom points tracker built for teachers.</p>

    <button id="googleLoginBtn" class="google-btn">
      <span class="google-icon">G</span>
      Continue with Google
    </button>
  </div>
</section>

<div id="app" class="hidden">

  <header>
    <div class="brand">
      <div class="brand-logo">PT</div>
      PointTrack
    </div>

    <div class="header-actions">
      <button id="themeBtn" class="icon-btn" title="Toggle dark mode">◐</button>
      <button id="logoutBtn" class="logout-btn">Log out</button>
    </div>
  </header>

  <main>

    <section id="dashboardView">

      <div class="dashboard-welcome">
        <div class="welcome">
          <h2>Welcome back 👋</h2>
          <p id="teacherEmail"></p>
        </div>

        <button id="dashboardCreateClassBtn" class="dashboard-create-btn">
          + Create Class
        </button>
      </div>

      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-label">Classes</div>
          <div id="totalClasses" class="stat-value">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Students</div>
          <div id="totalStudents" class="stat-value">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Total Points</div>
          <div id="totalPoints" class="stat-value">0</div>
        </div>

      </div>

      <div class="section-header">
        <div>
          <h3>Your Classes</h3>
          <div class="section-subtitle">
            Open a class to manage students and points.
          </div>
        </div>
      </div>

      <div id="classesContainer" class="classes-grid"></div>

    </section>

    <section id="classView" class="hidden">

      <button id="backBtn" class="back-btn">
        ← Back to Classes
      </button>

      <div class="class-title">

        <div>
          <h2 id="currentClassName"></h2>
          <p id="currentClassInfo"></p>
        </div>

        <div class="class-actions">
          <button id="historyBtn" class="secondary-btn">
            View History
          </button>

          <button id="addStudentBtn" class="primary-btn">
            + Add Student
          </button>
        </div>

      </div>

      <div id="studentsContainer" class="student-list"></div>

    </section>

  </main>
</div>

<div id="classModal" class="modal-overlay hidden">
  <div class="modal">

    <h3>Create Class</h3>

    <div class="field">
      <label>Class Name</label>
      <input id="classNameInput" type="text" maxlength="120" placeholder="e.g. 10-Apple">
    </div>

    <div class="field">
      <label>School Year</label>
      <input id="schoolYearInput" type="text" maxlength="30" placeholder="e.g. 2026–2027">
    </div>

    <div class="field">
      <label>Term</label>
      <input id="termInput" type="text" maxlength="50" placeholder="e.g. Term 1">
    </div>

    <div class="modal-actions">
      <button id="cancelClassBtn" class="secondary-btn">Cancel</button>
      <button id="saveClassBtn" class="primary-btn">Create Class</button>
    </div>

  </div>
</div>

<div id="studentModal" class="modal-overlay hidden">
  <div class="modal">

    <h3>Add Student</h3>

    <div class="field">
      <label>Student Name</label>
      <input id="studentNameInput" type="text" maxlength="120" placeholder="e.g. Juan Dela Cruz">
    </div>

    <div class="modal-actions">
      <button id="cancelStudentBtn" class="secondary-btn">Cancel</button>
      <button id="saveStudentBtn" class="primary-btn">Add Student</button>
    </div>

  </div>
</div>

<div id="historyModal" class="modal-overlay hidden">
  <div class="modal history-modal">

    <div class="history-header">
      <div>
        <h3>Point History</h3>
        <p id="historySubtitle"></p>
      </div>

      <button id="closeHistoryBtn" class="secondary-btn">
        Close
      </button>
    </div>

    <div id="historyContainer" class="history-container"></div>

  </div>
</div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://hczhnfrjcqnhodecmwuw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_jBsWWgn62dAwCZWgNtB-kg_Pbpt7Ova";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentClass = null;
let restoringClass = false;
let showingApp = false;


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");
const googleLoginBtn = document.getElementById("googleLoginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const themeBtn = document.getElementById("themeBtn");

const dashboardView = document.getElementById("dashboardView");
const classView = document.getElementById("classView");

const classesContainer = document.getElementById("classesContainer");
const studentsContainer = document.getElementById("studentsContainer");

const teacherEmail = document.getElementById("teacherEmail");
const currentClassName = document.getElementById("currentClassName");
const currentClassInfo = document.getElementById("currentClassInfo");

const totalClasses = document.getElementById("totalClasses");
const totalStudents = document.getElementById("totalStudents");
const totalPoints = document.getElementById("totalPoints");

const dashboardCreateClassBtn =
  document.getElementById("dashboardCreateClassBtn");

const classModal = document.getElementById("classModal");
const cancelClassBtn = document.getElementById("cancelClassBtn");
const saveClassBtn = document.getElementById("saveClassBtn");

const classNameInput = document.getElementById("classNameInput");
const schoolYearInput = document.getElementById("schoolYearInput");
const termInput = document.getElementById("termInput");

const studentModal = document.getElementById("studentModal");
const addStudentBtn = document.getElementById("addStudentBtn");
const cancelStudentBtn = document.getElementById("cancelStudentBtn");
const saveStudentBtn = document.getElementById("saveStudentBtn");
const studentNameInput = document.getElementById("studentNameInput");

const historyBtn = document.getElementById("historyBtn");
const historyModal = document.getElementById("historyModal");
const closeHistoryBtn = document.getElementById("closeHistoryBtn");
const historyContainer = document.getElementById("historyContainer");
const historySubtitle = document.getElementById("historySubtitle");


/* =========================================================
   DECIMAL NUMBER ENGINE

   Supabase NUMERIC values can be much larger than JavaScript
   Number safely supports.

   This system stores a decimal as:

   integer digits + decimal scale

   Example:

   12.50 → integer 1250, scale 2
   0.5   → integer 5, scale 1
   -7    → integer -7, scale 0

   This means huge values and decimal values both work
   without floating-point precision problems.
========================================================= */

function parseDecimal(value) {

  const raw = String(value).trim();

  if (!/^[+-]?\d+(?:\.\d+)?$/.test(raw)) {
    return null;
  }

  let sign = 1;

  let body = raw;

  if (body.startsWith("-")) {
    sign = -1;
    body = body.slice(1);
  } else if (body.startsWith("+")) {
    body = body.slice(1);
  }

  const parts = body.split(".");

  const whole = parts[0];
  const fraction = parts[1] || "";

  const scale = fraction.length;

  let digits = whole + fraction;

  digits = digits.replace(/^0+(?=\d)/, "");

  let integer;

  try {
    integer = BigInt(digits || "0") * BigInt(sign);
  } catch {
    return null;
  }

  return normalizeDecimal({
    integer,
    scale
  });
}


function normalizeDecimal(value) {

  let integer = value.integer;
  let scale = value.scale;

  if (integer === 0n) {
    return {
      integer: 0n,
      scale: 0
    };
  }

  while (
    scale > 0 &&
    integer % 10n === 0n
  ) {
    integer /= 10n;
    scale--;
  }

  return {
    integer,
    scale
  };
}


function alignDecimals(a, b) {

  const scale = Math.max(
    a.scale,
    b.scale
  );

  const aInteger =
    a.integer *
    10n ** BigInt(scale - a.scale);

  const bInteger =
    b.integer *
    10n ** BigInt(scale - b.scale);

  return {
    a: {
      integer: aInteger,
      scale
    },
    b: {
      integer: bInteger,
      scale
    }
  };
}


function addDecimals(a, b) {

  const aligned =
    alignDecimals(a, b);

  return normalizeDecimal({
    integer:
      aligned.a.integer +
      aligned.b.integer,
    scale:
      aligned.a.scale
  });
}


function negateDecimal(value) {

  return {
    integer:
      -value.integer,
    scale:
      value.scale
  };
}


function isPositiveDecimal(value) {
  return value.integer > 0n;
}


function isNegativeDecimal(value) {
  return value.integer < 0n;
}


function isZeroDecimal(value) {
  return value.integer === 0n;
}


function formatDecimal(value) {

  const normalized =
    normalizeDecimal(value);

  let integer =
    normalized.integer;

  const scale =
    normalized.scale;

  if (integer === 0n) {
    return "0";
  }

  const negative =
    integer < 0n;

  if (negative) {
    integer = -integer;
  }

  let digits =
    integer.toString();

  if (scale === 0) {
    return (
      negative ? "−" : ""
    ) +
    addThousandsSeparators(digits);
  }

  if (digits.length <= scale) {
    digits =
      "0".repeat(
        scale - digits.length + 1
      ) +
      digits;
  }

  const split =
    digits.length - scale;

  const whole =
    digits.slice(0, split);

  const fraction =
    digits.slice(split);

  return (
    negative ? "−" : ""
  ) +
    addThousandsSeparators(whole) +
    "." +
    fraction;
}


function addThousandsSeparators(
  digits
) {

  let result = "";

  for (
    let i = 0;
    i < digits.length;
    i++
  ) {

    if (
      i > 0 &&
      (digits.length - i) % 3 === 0
    ) {
      result += ",";
    }

    result += digits[i];
  }

  return result;
}


function decimalFromDatabase(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return {
      integer: 0n,
      scale: 0
    };
  }

  const parsed =
    parseDecimal(value);

  if (!parsed) {
    console.error(
      "Invalid numeric value from database:",
      value
    );

    return {
      integer: 0n,
      scale: 0
    };
  }

  return parsed;
}


function decimalToDatabase(
  value
) {

  return formatDecimal(value)
    .replaceAll(",", "")
    .replace("−", "-");
}


/* =========================================================
   CURRENT CLASS STORAGE
========================================================= */

function getLastClassKey() {

  if (!currentUser) {
    return null;
  }

  return (
    "pointtrack-last-class-" +
    currentUser.id
  );
}


function saveLastClass(classId) {

  const key =
    getLastClassKey();

  if (!key) {
    return;
  }

  localStorage.setItem(
    key,
    classId
  );
}


function getLastClassId() {

  const key =
    getLastClassKey();

  if (!key) {
    return null;
  }

  return localStorage.getItem(key);
}


function clearLastClass() {

  const key =
    getLastClassKey();

  if (!key) {
    return;
  }

  localStorage.removeItem(key);
}

/* =========================================================
   LOAD CLASSES
========================================================= */

async function loadClasses() {

  if (!currentUser) {
    return;
  }

  classesContainer.innerHTML =
    '<div class="empty-state">Loading your classes...</div>';

  const {
    data,
    error
  } =
    await db
      .from("classes")
      .select("*")
      .eq(
        "teacher_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (error) {

    console.error(error);

    totalClasses.textContent = "—";
    totalStudents.textContent = "—";
    totalPoints.textContent = "—";

    classesContainer.innerHTML =
      '<div class="empty-state">Could not load classes.</div>';

    return;
  }

  totalClasses.textContent =
    data.length.toLocaleString();

  if (!data.length) {

    clearLastClass();

    totalStudents.textContent =
      "0";

    totalPoints.textContent =
      "0";

    classesContainer.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">🏫</div>

        <div class="empty-title">
          No classes yet
        </div>

        <div class="empty-description">
          Create your first class to start
          tracking students and points.
        </div>

        <button
          id="emptyCreateClassBtn"
          class="empty-create-btn"
        >
          + Create Your First Class
        </button>

      </div>

    `;

    document
      .getElementById(
        "emptyCreateClassBtn"
      )
      .addEventListener(
        "click",
        openCreateClassModal
      );

    return;
  }

  const classIds =
    data.map(
      classItem =>
        classItem.id
    );

  const {
    data: students,
    error: studentsError
  } =
    await db
      .from("students")
      .select(
        "id, class_id, points"
      )
      .in(
        "class_id",
        classIds
      );

  if (studentsError) {

    console.error(
      studentsError
    );

    totalStudents.textContent =
      "—";

    totalPoints.textContent =
      "—";
  }

  const classStats = {};

  data.forEach(
    classItem => {

      classStats[
        classItem.id
      ] = {

        students: 0,

        points: {
          integer: 0n,
          scale: 0
        }

      };

    }
  );

  if (students) {

    students.forEach(
      student => {

        const stats =
          classStats[
            student.class_id
          ];

        if (!stats) {
          return;
        }

        stats.students++;

        stats.points =
          addDecimals(
            stats.points,
            decimalFromDatabase(
              student.points
            )
          );

      }
    );
  }

  const studentCount =
    students
      ? students.length
      : 0;

  let pointsTotal = {
    integer: 0n,
    scale: 0
  };

  if (students) {

    students.forEach(
      student => {

        pointsTotal =
          addDecimals(
            pointsTotal,
            decimalFromDatabase(
              student.points
            )
          );

      }
    );

  }

  totalStudents.textContent =
    studentCount.toLocaleString();

  totalPoints.textContent =
    formatDecimal(
      pointsTotal
    );

  classesContainer.innerHTML = "";

  data.forEach(
    classItem => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "class-card";

      const info = [
        classItem.school_year,
        classItem.term
      ]
        .filter(Boolean)
        .join(" • ");

      const stats =
        classStats[
          classItem.id
        ] || {

          students: 0,

          points: {
            integer: 0n,
            scale: 0
          }

        };

      card.innerHTML = `

        <div class="class-card-top">

          <div>

            <h4>
              ${escapeHtml(
                classItem.name
              )}
            </h4>

            <div class="class-info">
              ${escapeHtml(
                info ||
                "No additional information"
              )}
            </div>

          </div>

          <button
            class="class-delete"
            title="Delete class"
          >
            ×
          </button>

        </div>

        <div class="class-stats">

          <div class="class-stat">

            <div class="class-stat-label">
              Students
            </div>

            <div class="class-stat-value">
              ${stats.students.toLocaleString()}
            </div>

          </div>

          <div class="class-stat">

            <div class="class-stat-label">
              Total Points
            </div>

            <div class="class-stat-value">
              ${formatDecimal(
                stats.points
              )}
            </div>

          </div>

        </div>

        <button class="open-class">
          Open Class
        </button>

      `;

      card
        .querySelector(
          ".open-class"
        )
        .addEventListener(
          "click",
          () =>
            openClass(
              classItem
            )
        );

      card
        .querySelector(
          ".class-delete"
        )
        .addEventListener(
          "click",
          () =>
            deleteClass(
              classItem
            )
        );

      classesContainer.appendChild(
        card
      );

    }
  );


  /* Restore previously opened class */

  const savedClassId =
    getLastClassId();

  if (
    savedClassId &&
    !restoringClass &&
    dashboardView.classList.contains(
      "hidden"
    ) === false
  ) {

    const savedClass =
      data.find(
        classItem =>
          classItem.id ===
          savedClassId
      );

    if (savedClass) {

      restoringClass = true;

      await openClass(
        savedClass,
        false
      );

      restoringClass = false;

    } else {

      clearLastClass();

    }
  }
}


/* =========================================================
   DELETE CLASS
========================================================= */

async function deleteClass(
  classItem
) {

  const confirmed =
    confirm(
      `Delete "${classItem.name}"?\n\n` +
      "This will also remove its students and point history."
    );

  if (!confirmed) {
    return;
  }

  const {
    data: students
  } =
    await db
      .from("students")
      .select("id")
      .eq(
        "class_id",
        classItem.id
      );

  if (
    students &&
    students.length
  ) {

    const studentIds =
      students.map(
        student =>
          student.id
      );

    const {
      error: historyDeleteError
    } =
      await db
        .from("point_history")
        .delete()
        .in(
          "student_id",
          studentIds
        );

    if (historyDeleteError) {

      alert(
        "Could not delete point history:\n" +
        historyDeleteError.message
      );

      return;
    }

    const {
      error: studentsDeleteError
    } =
      await db
        .from("students")
        .delete()
        .eq(
          "class_id",
          classItem.id
        );

    if (studentsDeleteError) {

      alert(
        "Could not delete students:\n" +
        studentsDeleteError.message
      );

      return;
    }
  }

  const { error } =
    await db
      .from("classes")
      .delete()
      .eq(
        "id",
        classItem.id
      );

  if (error) {

    alert(
      "Could not delete class:\n" +
      error.message
    );

    return;
  }

  if (
    getLastClassId() ===
    classItem.id
  ) {

    clearLastClass();

  }

  if (
    currentClass &&
    currentClass.id ===
    classItem.id
  ) {

    showDashboard(true);

  }

  await loadClasses();
}

/* =========================================================
   POINT INPUT VALIDATION
========================================================= */

function getPointAmount(
  input
) {

  const raw =
    input.value.trim();

  if (!raw) {

    alert(
      "Please enter a point amount."
    );

    input.focus();

    return null;
  }

  /*
    Positive decimal amount only.

    Valid:
      1
      0.5
      1.25
      1000000000000000000000.75

    Invalid:
      -1
      +1
      .
      1.
      1.2.3
      abc
  */

  if (
    !/^\d+(?:\.\d+)?$/.test(raw)
  ) {

    alert(
      "Please enter a positive number, such as 1, 0.5, or 1.25."
    );

    input.focus();

    return null;
  }

  const amount =
    parseDecimal(raw);

  if (
    !amount ||
    !isPositiveDecimal(amount)
  ) {

    alert(
      "Please enter a point amount greater than 0."
    );

    input.focus();

    return null;
  }

  return amount;
}


/* =========================================================
   CHANGE POINTS
========================================================= */

async function changePoints(
  student,
  amountInput,
  direction,
  card
) {

  const amount =
    getPointAmount(
      amountInput
    );

  if (!amount) {
    return;
  }

  const oldPoints =
    decimalFromDatabase(
      student.points
    );

  const change =
    direction === 1
      ? amount
      : negateDecimal(
          amount
        );

  const newPoints =
    addDecimals(
      oldPoints,
      change
    );

  const databasePoints =
    decimalToDatabase(
      newPoints
    );

  const {
    error
  } =
    await db
      .from("students")
      .update({
        points:
          databasePoints
      })
      .eq(
        "id",
        student.id
      );

  if (error) {

    console.error(error);

    alert(
      "Could not update points:\n" +
      error.message
    );

    return;
  }

  const {
    error: historyError
  } =
    await db
      .from("point_history")
      .insert({

        student_id:
          student.id,

        amount:
          decimalToDatabase(
            change
          )

      });

  if (historyError) {

    console.error(
      "History error:",
      historyError
    );

  }

  student.points =
    databasePoints;

  const pointsDisplay =
    card.querySelector(
      ".points-display"
    );

  pointsDisplay.textContent =
    formatDecimal(
      newPoints
    );

  showPointAnimation(
    card,
    change
  );
}


/* =========================================================
   FLOATING POINT ANIMATION
========================================================= */

function showPointAnimation(
  card,
  amount
) {

  const animation =
    document.createElement(
      "div"
    );

  animation.className =
    "point-float " +
    (
      isPositiveDecimal(amount)
        ? "positive"
        : "negative"
    );

  const formatted =
    formatDecimal(
      amount
    );

  animation.textContent =
    isPositiveDecimal(amount)
      ? `+${formatted}`
      : formatted;

  card.appendChild(
    animation
  );

  setTimeout(
    () =>
      animation.remove(),
    850
  );
}


/* =========================================================
   DELETE STUDENT
========================================================= */

async function deleteStudent(
  student
) {

  const confirmed =
    confirm(
      `Remove ${student.name} from this class?`
    );

  if (!confirmed) {
    return;
  }

  const {
    error: historyError
  } =
    await db
      .from("point_history")
      .delete()
      .eq(
        "student_id",
        student.id
      );

  if (historyError) {

    alert(
      "Could not remove point history:\n" +
      historyError.message
    );

    return;
  }

  const {
    error
  } =
    await db
      .from("students")
      .delete()
      .eq(
        "id",
        student.id
      );

  if (error) {

    alert(
      "Could not remove student:\n" +
      error.message
    );

    return;
  }

  await loadStudents();
}


/* =========================================================
   POINT HISTORY
========================================================= */

historyBtn.addEventListener(
  "click",
  loadHistory
);


closeHistoryBtn.addEventListener(
  "click",
  closeHistory
);


async function loadHistory() {

  if (!currentClass) {
    return;
  }

  const classId =
    currentClass.id;

  historyModal.classList.remove(
    "hidden"
  );

  historyContainer.innerHTML =
    '<div class="history-empty">Loading history...</div>';

  historySubtitle.textContent =
    currentClass.name;

  const {
    data: students,
    error: studentsError
  } =
    await db
      .from("students")
      .select(
        "id, name"
      )
      .eq(
        "class_id",
        classId
      );

  if (studentsError) {

    console.error(
      studentsError
    );

    historyContainer.innerHTML =
      '<div class="history-empty">Could not load history.</div>';

    return;
  }

  if (
    !currentClass ||
    currentClass.id !==
    classId
  ) {

    closeHistory();

    return;
  }

  if (!students.length) {

    historyContainer.innerHTML =
      '<div class="history-empty">No students yet.</div>';

    return;
  }

  const studentIds =
    students.map(
      student =>
        student.id
    );

  const {
    data: history,
    error: historyError
  } =
    await db
      .from("point_history")
      .select("*")
      .in(
        "student_id",
        studentIds
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (historyError) {

    console.error(
      historyError
    );

    historyContainer.innerHTML =
      '<div class="history-empty">Could not load history.</div>';

    return;
  }

  if (!history.length) {

    historyContainer.innerHTML = `

      <div class="history-empty">
        No point changes have been
        recorded yet.
      </div>

    `;

    return;
  }

  const studentMap = {};

  students.forEach(
    student => {

      studentMap[
        student.id
      ] =
        student.name;

    }
  );

  historyContainer.innerHTML =
    "";

  history.forEach(
    entry => {

      const studentName =
        studentMap[
          entry.student_id
        ] ||
        "Unknown Student";

      const amount =
        decimalFromDatabase(
          entry.amount
        );

      const positive =
        isPositiveDecimal(
          amount
        );

      const date =
        new Date(
          entry.created_at
        );

      const formattedDate =
        date.toLocaleString(
          undefined,
          {
            dateStyle:
              "medium",
            timeStyle:
              "short"
          }
        );

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "history-entry";

      const amountText =
        formatDecimal(
          amount
        );

      row.innerHTML = `

        <div>

          <div class="history-student">
            ${escapeHtml(
              studentName
            )}
          </div>

          <div class="history-time">
            ${escapeHtml(
              formattedDate
            )}
          </div>

        </div>

        <div
          class="history-amount ${
            positive
              ? "positive"
              : "negative"
          }"
        >
          ${
            positive
              ? "+"
              : ""
          }${escapeHtml(
            amountText
          )}
        </div>

      `;

      historyContainer.appendChild(
        row
      );

    }
  );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}
